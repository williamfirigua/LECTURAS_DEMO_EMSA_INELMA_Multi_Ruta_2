apply plugin: 'com.android.application'
apply plugin: 'realm-android'

android {
    compileSdkVersion 32
    // buildToolsVersion se deja fuera: AGP elige la version correcta automaticamente

    defaultConfig {
        applicationId "com.gstolima.accesoyseguridad"
        minSdkVersion 29
        targetSdkVersion 32
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    productFlavors {
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    jcenter() // deprecado desde 2022; si algo falla al resolver, migra esas libs a mavenCentral()
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.google.android.gms:play-services-maps:16.0.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.4.1'

    implementation files('libs/ksoap2-android-assembly-2.6.4-jar-with-dependencies.jar')
    implementation files('libs/zip4j_1.3.2.jar')
    implementation 'com.journeyapps:zxing-android-embedded:3.3.0@aar'
    implementation files('libs/core-3.2.1.jar')
    // javase-3.2.1.jar retirado: es ZXing para JVM de escritorio (java.awt), no se usa y no funciona en Android.
    implementation 'org.slf4j:slf4j-api:1.7.25'

    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // --- CameraX (compatible con compileSdk 32 y AGP 4.1.2) ---
    def camerax_version = "1.1.0"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
}